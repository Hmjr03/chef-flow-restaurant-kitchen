{% extends "base.html" %}

{% block title %}
ChefFlow | Formulário
{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="content-card p-4 p-md-5">

                    <h1 class="fw-bold mb-4">
                        {% if object %}
                            Editar
                        {% else %}
                            Criar
                        {% endif %}
                    </h1>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-warning px-4"
                            >
                                Salvar
                            </button>


                            <a
                                href="javascript:history.back()"
                                class="btn btn-outline-secondary"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>
</section>

{% endblock %}
