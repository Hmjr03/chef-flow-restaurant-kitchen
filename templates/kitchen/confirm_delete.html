{% extends "base.html" %}

{% block title %}
ChefFlow | Excluir
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="content-card p-5 text-center">

                    <h1 class="h3 fw-bold mb-3">
                        Confirmar exclusão
                    </h1>


                    <p class="text-secondary">
                        Tem certeza que deseja excluir:
                    </p>


                    <h2 class="h5 mb-4">
                        {{ object }}
                    </h2>


                    <form method="post">

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Sim, excluir
                        </button>


                        <a
                            href="javascript:history.back()"
                            class="btn btn-outline-secondary ms-2"
                        >
                            Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
